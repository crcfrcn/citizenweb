# 产品自己的唯一自动化工作流；配置文件不执行编译或GitHub操作。
name: 公民官网·Web
run-name: 公民官网·Web·${{ github.run_number }}
'on':
  workflow_dispatch: {}
concurrency:
  group: citizenweb-web
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
defaults:
  run:
    shell: bash
env:
  PLATFORM: web
  PRODUCT_WORK: ${{ github.workspace }}/target/build/${{ github.run_id }}-${{ github.run_attempt }}
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
jobs:
  version:
    name: 公民官网·Web·版本
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: version
        name: 计算本Run版本
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/web.yml/runs?branch=main&event=workflow_dispatch&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [[ -z "$previous" ]]; then
            version="$(jq -er '.version' package.json)"
          else
            # 只对最后一个非 9 数字加一，再将末尾的 9 归零，保留长版本号的精度。
            version="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous/artifacts?per_page=100" | jq -er '
              first(.artifacts[].name | capture("^公民官网·Web·v(?<base>[0-9]+\\.[0-9]+\\.)(?<patch>[0-9]+)$"))
              | .base + (.patch | sub("^0+"; "") | capture("^(?<head>[0-9]*?)(?<digit>[0-8]?)(?<tail>9*)$")
                | .head + (((.digit | tonumber? // 0) + 1) | tostring) + (.tail | gsub("9"; "0")))
            ')"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
  compile:
    needs: version
    name: 公民官网·Web·v${{ needs.version.outputs.version }}
    env:
      PRODUCT_VERSION: ${{ needs.version.outputs.version }}
    if: github.ref == 'refs/heads/main' && github.repository == 'crcfrcn/citizenweb'
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 读取宪法工具声明
        id: constitution
        run: |
          node --input-type=module -e "import {constitutionTools} from './scripts/config.mjs'; for (const [name, version] of Object.entries(constitutionTools)) console.log(name+'='+version)" >> "$GITHUB_OUTPUT"
      - name: 恢复官方缓存
        id: cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.rustup/toolchains/${{ steps.constitution.outputs.rust }}-aarch64-apple-darwin
          key: citizenweb-web-official-25.2.1-${{ hashFiles('package-lock.json', 'constitution/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenweb-web-official-25.2.1-${{ hashFiles('package-lock.json', 'constitution/Cargo.lock') }}-
      - name: 准备锁定的宪法工具
        env:
          RUST_VERSION: ${{ steps.constitution.outputs.rust }}
          BINDGEN_VERSION: ${{ steps.constitution.outputs.bindgen }}
          RUSTUP_AUTO_INSTALL: '0'
        run: |
          set -euo pipefail
          # 优先复用锁定工具；只补齐缺失的工具链、目标和依赖。
          target=wasm32-unknown-unknown
          if ! rustup run "$RUST_VERSION" rustc --version; then
            rustup toolchain install "$RUST_VERSION" --profile minimal --target "$target"
          elif ! rustup target list --installed --toolchain "$RUST_VERSION" | grep -Fx "$target"; then
            rustup target add "$target" --toolchain "$RUST_VERSION"
          fi
          bindgen="$(command -v wasm-bindgen || true)"
          if [ -z "$bindgen" ] || [ "$("$bindgen" --version)" != "wasm-bindgen $BINDGEN_VERSION" ]; then
            bin="$GITHUB_WORKSPACE/target/cache/worker/bin"
            bindgen="$bin/wasm-bindgen"
            if [ ! -x "$bindgen" ] || [ "$("$bindgen" --version)" != "wasm-bindgen $BINDGEN_VERSION" ]; then
              archive="wasm-bindgen-$BINDGEN_VERSION-aarch64-apple-darwin"
              mkdir -p "$bin"
              curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
                "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$BINDGEN_VERSION/$archive.tar.gz" |
                tar -xzf - -C "$bin" --strip-components=1 "$archive/wasm-bindgen"
            fi
          fi
          printf 'WASM_BINDGEN=%s\n' "$bindgen" >> "$GITHUB_ENV"
          cargo +"$RUST_VERSION" fetch --locked --offline --manifest-path constitution/Cargo.toml ||
            cargo +"$RUST_VERSION" fetch --locked --manifest-path constitution/Cargo.toml
      - name: 真实代码回归与严格分析
        run: |
          node scripts/build.mjs build "$PLATFORM" --verify
      - name: 装配并核对正式附件
        run: |
          node scripts/build.mjs package "$PLATFORM"
      - name: 公民官网·Web·v${{ needs.version.outputs.version }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 公民官网·Web·v${{ needs.version.outputs.version }}
          path: ${{ env.PRODUCT_WORK }}/artifact/*
          if-no-files-found: error
      - name: 创建正式Tag和Release并逐件回读
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="公民官网·Web·v$PRODUCT_VERSION"
          encoded="$(printf '%s' "$name" | jq -sRr @uri)"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const proof=JSON.parse(readFileSync(process.env.PRODUCT_WORK+'/proof.json'));
          writeFileSync(process.env.PRODUCT_WORK+'/notes.md','<!-- automation:'+JSON.stringify(proof)+' -->\n');
          JS
          created_tag=0
          rollback() {
            code=$?
            if [ "$code" -ne 0 ] && [ "$created_tag" = 1 ]; then
              if gh release view "$name" --repo "$GITHUB_REPOSITORY" --json body > "$PRODUCT_WORK/rollback.json"; then
                if jq -er --arg id "$GITHUB_RUN_ID" '.body|capture("automation:(?<proof>[^\n]*) -->").proof|fromjson|select(.run_id==($id|tonumber))' "$PRODUCT_WORK/rollback.json" >/dev/null; then
                  gh release delete "$name" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo '本轮正式候选撤销失败' >&2
                fi
              else
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded" || echo '本轮Tag撤销失败' >&2
              fi
            fi
            exit "$code"
          }
          trap rollback EXIT
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$name" -f "sha=$GITHUB_SHA" > "$PRODUCT_WORK/tag.json"
          created_tag=1
          assets=("$PRODUCT_WORK"/artifact/*)
          uploads=()
          for file in "${assets[@]}"; do uploads+=("$file#$name.${file##*.}"); done
          gh release create "$name" "${uploads[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --verify-tag --draft --title "$name" --notes-file "$PRODUCT_WORK/notes.md"
          mkdir "$PRODUCT_WORK/readback"
          gh release download "$name" --repo "$GITHUB_REPOSITORY" --dir "$PRODUCT_WORK/readback"
          for file in "${assets[@]}"; do cmp "$file" "$PRODUCT_WORK/readback/$(basename "$file")"; done
          gh release edit "$name" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest=false
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$encoded" > "$PRODUCT_WORK/release.json"
          jq -e --arg name "$name" --arg sha "$GITHUB_SHA" --argjson count 3 '.name==$name and .tag_name==$name and .target_commitish==$sha and .draft==false and .prerelease==false and (.assets|length)==$count' "$PRODUCT_WORK/release.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$encoded" | jq -e --arg sha "$GITHUB_SHA" '.object.type=="commit" and .object.sha==$sha' >/dev/null
      - name: 保存官方缓存
        if: always()
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        timeout-minutes: 2
        continue-on-error: true
        with:
          path: |
            target/cache
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.rustup/toolchains/${{ steps.constitution.outputs.rust }}-aarch64-apple-darwin
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: 清理本轮现场
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,shutil
          p=pathlib.Path(os.environ['PRODUCT_WORK'])
          if p.exists():shutil.rmtree(p)
          PY
  cleanup:
    name: 公民官网·Web·收尾
    needs: [version, compile]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: 保留本平台最新版本、成功失败记录和缓存
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.version.result == 'success' && needs.compile.result == 'success' && 'success' || 'failure' }}
          PREFIX: 公民官网·Web·v
          CACHE_PREFIX: citizenweb-web-
        run: |
          set -euo pipefail
          workflow="${GITHUB_WORKFLOW_REF%@*}"; workflow="${workflow##*/}"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" > "$RUNNER_TEMP/caches.json"
          jq -r --arg prefix "$CACHE_PREFIX" '[.[].actions_caches[]|select(.ref=="refs/heads/main" and (.key|startswith($prefix)))]|sort_by(.created_at,.id)|reverse|.[1:][]|.id' "$RUNNER_TEMP/caches.json" |
          while IFS= read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
          if [ "$RESULT" = success ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
            jq -r --arg prefix "$PREFIX" '[.[][]|select(.draft==false and (.tag_name|startswith($prefix)))]|sort_by(.published_at,.id)|reverse|.[1:][]|.tag_name' "$RUNNER_TEMP/releases.json" |
            while IFS= read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&event=workflow_dispatch&per_page=100" > "$RUNNER_TEMP/runs.json"
          jq --argjson current "$GITHUB_RUN_ID" --arg result "$RESULT" '
            [.[].workflow_runs[]|select(.status=="completed" or .id==$current)|
             .+{state:(if .id==$current then $result elif .conclusion=="success" then "success" else "failure" end)}]|
            group_by(.state)|map(sort_by(.run_number)|last.id)' "$RUNNER_TEMP/runs.json" > "$RUNNER_TEMP/keep.json"
          jq -r --argjson current "$GITHUB_RUN_ID" --slurpfile keep "$RUNNER_TEMP/keep.json" '
            [.[].workflow_runs[]|select(.status=="completed" and .id!=$current)|select(.id as $id|$keep[0]|index($id)|not)]|
            sort_by(.conclusion=="success",.run_number)[]|.id' "$RUNNER_TEMP/runs.json" |
          while IFS= read -r id; do gh run delete "$id" --repo "$GITHUB_REPOSITORY"; done
