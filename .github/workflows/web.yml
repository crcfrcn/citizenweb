name: 公民官网·Web
run-name: 公民官网·Web·v${{ inputs.version }}
'on':
  workflow_dispatch:
    inputs:
      version:
        description: 产品 Build 计算的候选版本
        required: true
        type: string
concurrency:
  group: citizenweb-web-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  release:
    name: 公民官网·Web·v${{ inputs.version }}
    env:
      PRODUCT_AUTOMATION_VERSION: ${{ inputs.version }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: "${{ github.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 25.2.1
      - name: 恢复本产品官方工具与依赖缓存
        id: compiler_cache
        continue-on-error: true
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.local/share/product-resources/tools/archives
            ~/.local/share/product-resources/tools/shared
            ~/.local/share/product-resources/tools/parsers
            ~/.local/share/product-resources/rely/archives
            ~/.local/share/product-resources/rely/objects
          key: citizenweb-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: citizenweb-web-${{ runner.os }}-${{ runner.arch }}-
      - name: 调用本仓Build并建立正式Web版本
        env:
          GH_TOKEN: "${{ github.token }}"
        run: node scripts/build.mjs ci-build web
      - name: 保存本产品最新缓存
        if: success() || failure()
        continue-on-error: true
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.local/share/product-resources/tools/archives
            ~/.local/share/product-resources/tools/shared
            ~/.local/share/product-resources/tools/parsers
            ~/.local/share/product-resources/rely/archives
            ~/.local/share/product-resources/rely/objects
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}
